[project]
name = "fastecdsa"
version = "4.0.0"
description = "Fast elliptic curve digital signatures"
readme = "README.rst"
requires-python = ">=3.11"

license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [
    {name = "Anton Kueltz", email = "kueltz.anton@gmail.com"}
]
keywords = ["elliptic", "curve", "cryptography", "ecdsa", "ecc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx>=7.4.7",
    "pytest-cov>=6.0.0",
    "gcovr>=8.3",
    "ty>=0.0.2",
    "maturin>=1.15.0",
    "requests>=2.32.3",
    "parameterized>=0.9.0",
    "jupyter>=1.1.1",
    "numpy>=2.4.6",
    "matplotlib>=3.11.2",
    "scipy>=1.17.1",
]

[project.urls]
repo = "https://github.com/AntonKueltz/fastecdsa"
docs = "https://fastecdsa.readthedocs.io"
pypi = "https://pypi.org/project/fastecdsa/"

[project.scripts]
benchmark = "fastecdsa.benchmark:run"

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.coverage.run]
omit = [
    "fastecdsa/benchmark.py",
    "fastecdsa/encoding/__init__.py"
]

[tool.maturin]
module-name = "fastecdsa.rust"
manifest-path = "fastecdsa-py-bindings/Cargo.toml"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=fastecdsa --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
extend-exclude = [
    "tests/**",
    "benchmark.py",
]
